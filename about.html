<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>about</title>
    <link rel="icon"
          href="images/favicon.ico"
          type="image/ico"
          sizes="16x16">
    <script src="site-footer.js"></script>
    <style>
        body {
            background: black;
            background-blend-mode: screen;
        }

        h1 {
            color: #cef8ec;
        }

        .text-area {
            background-color: #cef8ec;
            border: 6px double black;
            padding: 2px;
            margin-bottom: 8px;
            width: fit-content;
        }

        @keyframes moving {
            0% {
                transform: translate(-.5vw, -.5vh);
            }

            50% {
                transform: translate(.5vw, .5vh);
            }

            100% {
                transform: translate(-.5vw, -.5vh);
            }

        }

        .moving {
            animation: moving 4s ease-in-out infinite;
            position:fixed;
            top:-.5vh;
            left: -.5vw;
            z-index: -1;
        }
    </style>
</head>

<body>
    <site-footer></site-footer>

    <h1>about</h1>

    <div class="text-area">
        <p>This site uses no frameworks, I did everything in vanilla javascript. Check out the piano room as it is
            really
            cool.</p>

        <p>I hope you liked my website. It looks terrible and I am proud of that.</p>
    </div>

    <canvas id='cnvs' class="moving""></canvas>

    <site-footer></site-footer>
</body>

<script>
    // Taken from https://github.com/joeiddon/perlin/blob/master/perlin.js

    'use strict';
    let perlin = {
        rand_vect: function () {
            let theta = Math.random() * 2 * Math.PI;
            return { x: Math.cos(theta), y: Math.sin(theta) };
        },
        dot_prod_grid: function (x, y, vx, vy) {
            let g_vect;
            let d_vect = { x: x - vx, y: y - vy };
            if (this.gradients[[vx, vy]]) {
                g_vect = this.gradients[[vx, vy]];
            } else {
                g_vect = this.rand_vect();
                this.gradients[[vx, vy]] = g_vect;
            }
            return d_vect.x * g_vect.x + d_vect.y * g_vect.y;
        },
        smootherstep: function (x) {
            return 6 * x ** 5 - 15 * x ** 4 + 10 * x ** 3;
        },
        interp: function (x, a, b) {
            return a + this.smootherstep(x) * (b - a);
        },
        seed: function () {
            this.gradients = {};
            this.memory = {};
        },
        get: function (x, y) {
            if (this.memory.hasOwnProperty([x, y]))
                return this.memory[[x, y]];
            let xf = Math.floor(x);
            let yf = Math.floor(y);
            //interpolate
            let tl = this.dot_prod_grid(x, y, xf, yf);
            let tr = this.dot_prod_grid(x, y, xf + 1, yf);
            let bl = this.dot_prod_grid(x, y, xf, yf + 1);
            let br = this.dot_prod_grid(x, y, xf + 1, yf + 1);
            let xt = this.interp(x - xf, tl, tr);
            let xb = this.interp(x - xf, bl, br);
            let v = this.interp(y - yf, xt, xb);
            this.memory[[x, y]] = v;
            return v;
        }
    }
    perlin.seed();

    let cnvs = document.getElementById('cnvs');
    cnvs.width = window.innerWidth * 1.5;
    cnvs.height = window.innerHeight *1.5;
    let ctx = cnvs.getContext('2d');

    const GRID_SIZE = 8;
    const RESOLUTION = 32;
    const COLOR_SCALE = 1;
    const GREY_COLOR = 200;

    let mapRange = (value, inMin, inMax, outMin, outMax) => {
        return outMin + (value - inMin) * (outMax - outMin) / (inMax - inMin);
    }

    let pixel_size = cnvs.width / RESOLUTION;
    let num_pixels = GRID_SIZE / RESOLUTION;
    for (let y = 0; y < GRID_SIZE; y += num_pixels / GRID_SIZE) {
        for (let x = 0; x < GRID_SIZE; x += num_pixels / GRID_SIZE) {
            let v = perlin.get(x, y);//parseFloat(perlin.get(x, y) * COLOR_SCALE);
            ctx.fillStyle = `rgb(${GREY_COLOR} ${GREY_COLOR} ${GREY_COLOR} / ${mapRange(v, 0, 1, 0, 5)}%)`;
            ctx.fillRect(
                x / GRID_SIZE * cnvs.width,
                y / GRID_SIZE * cnvs.height,
                pixel_size,
                pixel_size
            );
        }
    }
</script>

</html>
