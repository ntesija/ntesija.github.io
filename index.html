<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <link rel="icon" href="images/favicon.ico" type="image/ico" sizes="16x16">
    <link rel="preload" href="background-textures/background.png" as="image" />
    <script src="site-footer.js"></script>
    <style>
        body {
            background-image: url("background-textures/background.png");
            margin: 0;
        }

        .nav-button-container {
            display: grid;
            gap: 8px;
            grid: repeat(3, 128px) / repeat(4, 256px);
            justify-content: center;
            margin-top: 64px;
            margin-bottom: 140px;
        }

        .nav-button {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            border: 4px solid #aaa;
            border-radius: 10% / 15%;
            position: relative;
        }

        .no-content {
            animation: scroll-background 4s infinite linear;
            background-image: url("background-textures/static.png"), url("background-textures/background.png");
            background-repeat: round;
            background-size: unset;
            background-position: unset;
        }

        .no-content-text {
            align-content: center;
            font-size: 40px;
            height: 100%;
            width: 100%;
            text-align: center;
            color: #74747429;
            font-weight: bold;
        }

        .friends-button {
            background-image: url("background-textures/friends.webp");
            background-color: #d5ffd5;
        }

        .stone-button {
            background-image: url("background-textures/stone.webp");
        }

        .shrinko-button {
            background-image: url("images/shrinko/shrinkoTitle.webp");
            background-color: #add3ff;
            background-size: contain;
        }

        .videos-button {
            background-image: url("background-textures/videos.webp");
            background-color: #ffdfee;
        }

        .piano-button {
            background-image: url("background-textures/piano.webp");
        }

        .about-button {
            background-image: url("images/portrait.png"), url("background-textures/star-background.jpg");
        }

        .music-button {
            background-image: url("background-textures/music.webp");
        }

        .web-button {
            background-image: url("background-textures/websites.webp");
        }

        .border-animation {
            animation: fade-out .75s forwards;
            border: 4px solid #5cb9d9aa;
            box-shadow: 0 0 10px #5cb9d9;
            border-radius: 10% / 15%;
            position: absolute;
            top: -4px;
            left: -4px;
            bottom: -4px;
            right: -4px;
            transition: opacity .75s;
            opacity: 0;
        }

        .nav-button:hover .border-animation {
            animation: fade-in .5s forwards;
            opacity: 1;
        }

        .nav-content {
            padding: 8px;
        }

        .hover-text {
            background: #eaeaea;
            border: 2px solid #aaa;
            border-radius: 64px;
            box-shadow: 2px 2px 10px #aaa;
            bottom: -76px;
            left: -17px;
            right: -17px;
            height: 64px;
            position: absolute;
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        .hover-text-content {
            align-content: center;
            color: initial;
            font-size: 26px;
            height: 100%;
            text-align: center;
            text-decoration: none;
        }

        .nav-button:hover .hover-text {
            animation: hover-text-in .2s ease-in-out .25s forwards;
            opacity: 1;
            transition: opacity .25s ease-in-out .25s;
        }

        .footer {
            background: linear-gradient(#aaa, #eaeaea 50%);
            border-top: 4px solid #5cb9d9;
            box-shadow: 0 -1px 3px #5cb9d9;
            bottom: 0;
            position: fixed;
            height: 128px;
            width: 100%;
        }

        .footer-name {
            color: #666;
            font-size: 40px;
            font-weight: bold;
            margin-top: 16px;
            text-align: center;
            width: 100%;
        }

        @keyframes scroll-background {
            from {
                background-position-y: 99%;
            }

            to {
                background-position-y: 0%;
            }
        }

        @keyframes fade-in {
            from {
                left: 0;
                right: 0;
            }

            to {
                left: -4px;
                right: -4px;
            }
        }

        @keyframes fade-out {
            from {
                left: -4px;
                right: -4px;
            }

            to {
                left: 10px;
                right: 10px;
            }
        }

        @keyframes hover-text-in {
            from {
                left: 0;
                right: 0;
                height: 58px;
            }

            to {
                left: -17px;
                right: -17px;
                height: 64px;
            }
        }

        @media (max-width: 1100px) {
            .nav-button-container {
                grid: repeat(4, 128px) / repeat(3, 256px);
            }
        }

        @media (max-width: 800px) {
            .nav-button-container {
                grid: repeat(6, 128px) / repeat(2, 256px);
            }

            .footer {
                height: 64px;
            }

            .footer-name {
                margin-top: 8px;
            }

        }

        @media (max-width: 500px) {
            .nav-button-container {
                grid: repeat(12, 128px) / repeat(1, 256px);
            }
        }
    </style>
</head>

<body>

        <a class="nav-button no-content" role="navigation">

        <a class="nav-button no-content" role="navigation">
